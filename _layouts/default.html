<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image }}">{% endif %}
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#171717;background:#fff;line-height:1.7}
    a{color:inherit}header{height:72px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 max(6%,calc((100% - 1120px)/2));position:sticky;top:0;background:#fff;z-index:5}
    .brand{font-size:1.2rem;font-weight:800;letter-spacing:-.7px;text-decoration:none}.brand span{font-weight:400}
    nav{display:flex;gap:26px}nav a{text-decoration:none;font-size:.94rem}nav a:hover{text-decoration:underline}
    main{min-height:65vh}.wrap{max-width:900px;margin:auto;padding:64px 24px 90px}
    .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#777;font-weight:700}
    h1{font-size:clamp(2.3rem,6vw,4.4rem);line-height:1.08;letter-spacing:-.055em;margin:14px 0 20px}
    .lead{font-size:1.25rem;line-height:1.55;color:#555;max-width:760px}
    .meta{font-size:.9rem;color:#777;margin:22px 0 30px}
    .cover{width:100%;max-height:480px;object-fit:cover;border-radius:3px;margin:12px 0 6px}
    .article-body{font-size:1.08rem}.article-body h2{font-size:1.8rem;line-height:1.2;letter-spacing:-.03em;margin:2.2em 0 .6em}
    .article-body p{margin:0 0 1.2em}.article-body strong{font-weight:700}.article-body blockquote{border-left:4px solid #171717;margin:2em 0;padding:8px 22px;font-size:1.25rem;font-weight:600}
    .sources{border-top:1px solid #e5e5e5;margin-top:55px;padding-top:25px}.sources h2{font-size:1.3rem}.sources li{margin:10px 0}.sources a{overflow-wrap:anywhere}
    .back{display:inline-block;margin-top:30px;text-decoration:none;border-bottom:1px solid #171717}
    .blog-intro{margin-bottom:42px}.post-list{display:grid;grid-template-columns:1fr 1fr;gap:24px}
    .post-card{border:1px solid #e8e8e8;text-decoration:none;transition:transform .2s,border-color .2s}.post-card:hover{transform:translateY(-3px);border-color:#999}
    .post-card img{width:100%;height:220px;object-fit:cover;display:block}.post-card-content{padding:22px}.post-card h2{font-size:1.45rem;line-height:1.2;margin:8px 0}.post-card p{color:#666;margin:8px 0 0}.empty{padding:35px;border:1px dashed #ccc;color:#666}
    footer{background:#111;color:#fff;padding:32px max(6%,calc((100% - 1120px)/2));display:flex;justify-content:space-between;gap:15px;font-size:.85rem}footer span{color:#aaa}
    @media(max-width:650px){header{height:auto;padding:18px 5%;flex-direction:column;gap:12px}nav{gap:16px;flex-wrap:wrap;justify-content:center}nav a{font-size:.85rem}.wrap{padding:42px 20px 65px}.post-list{grid-template-columns:1fr}.post-card img{height:200px}footer{padding:28px 6%;flex-direction:column}}
  </style>
</head>
<body>
<header>
  <a class="brand" href="/">PONTE<span>TRUCHA</span>.ORG</a>
  <nav aria-label="Navegación principal">
    <a href="/">Inicio</a><a href="/blog/">Blog</a><a href="/ra/">RA</a>
  </nav>
</header>
<main>{{ content }}</main>
<footer><strong>PONTE TRUCHA</strong><span>© 2026 PonteTrucha.org</span></footer>
</body>
</html>
